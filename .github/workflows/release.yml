name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Signed with the committed debug keystore (see app/build.gradle.kts comment) --
      # deliberately not a separate release keystore. Debug keystore credentials are
      # public/standard by convention, and this keeps every published APK's signature
      # consistent, so installing an update never conflicts with a previous release.
      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk SignPDF.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SignPDF.apk
          generate_release_notes: true
