[versions]
agp = "8.3.2"
kotlin = "1.9.23"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
lifecycle = "2.8.0"
navigation = "2.7.7"
coroutines = "1.8.0"
recyclerview = "1.3.2"
viewpager2 = "1.1.0"
coil = "2.6.0"
pdfboxAndroid = "2.0.27.0"
signaturePad = "1.3.1"
junit = "4.13.2"
junitExt = "1.2.1"
espresso = "3.6.1"
